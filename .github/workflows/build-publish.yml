name: Build and publish app image

on:
  push:
    branches: [main]
    paths:
      - remoteterm/Dockerfile
      - remoteterm/run.sh
      - remoteterm/config.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: https://github.com/statico/remoteterm-meshcore
  IMAGE_NAME: ${{ github.repository }}/remoteterm-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Works out what to build, and refuses to overwrite a version that has
  # already been released. See .claude/skills/release/SKILL.md for the rules.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream: ${{ steps.version.outputs.upstream }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app and upstream versions
        id: version
        run: |
          VERSION=$(grep '^version:' remoteterm/config.yaml | awk '{print $2}' | tr -d '"')

          # X.Y.Z    = upstream release X.Y.Z
          # X.Y.Z.N  = app-only revision N on top of upstream X.Y.Z
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::config.yaml version '${VERSION}' must be X.Y.Z or X.Y.Z.N"
            exit 1
          fi
          UPSTREAM=$(echo "$VERSION" | cut -d. -f1-3)

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            RELEASED=true
          else
            RELEASED=false
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "released=${RELEASED}" >> "$GITHUB_OUTPUT"
          echo "App version ${VERSION}, upstream image ${UPSTREAM}, already released: ${RELEASED}"

      - name: Require a CHANGELOG section for a new version
        if: steps.version.outputs.released == 'false'
        run: |
          if ! grep -qF "## [${{ steps.version.outputs.version }}]" remoteterm/CHANGELOG.md; then
            echo "::error::remoteterm/CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section"
            exit 1
          fi

      - name: Explain skipped build
        if: steps.version.outputs.released == 'true' && github.event_name == 'push'
        run: |
          echo "::notice::v${{ steps.version.outputs.version }} is already released, so this push does not rebuild it. Bump the version (X.Y.Z.N for app-only changes) to ship these changes."

  build-and-push:
    needs: prepare
    # A push never overwrites a released image; a manual run may rebuild one.
    if: needs.prepare.outputs.released == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: remoteterm/
          # Matches the two architectures the upstream image publishes.
          # amd64  → Intel/AMD machines, VMs
          # arm64  → Raspberry Pi 4/5, Odroid N2+, and RPi 3 running 64-bit HAOS
          platforms: linux/amd64,linux/arm64
          # Pin the upstream image to the release this app version packages
          # (the first three parts of the version).
          build-args: |
            REMOTETERM_VERSION=${{ needs.prepare.outputs.upstream }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, build-and-push]
    if: needs.prepare.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          UPSTREAM="${{ needs.prepare.outputs.upstream }}"
          # Body of this version's section in the Keep a Changelog file:
          # everything between "## [VERSION]" and the next "## [" heading.
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' remoteterm/CHANGELOG.md | sed -e '/./,$!d')

          if [ -z "$NOTES" ]; then
            echo "::error::No '## [${VERSION}]' section found in remoteterm/CHANGELOG.md"
            exit 1
          fi

          {
            echo "Packages upstream [RemoteTerm for MeshCore ${UPSTREAM}](${UPSTREAM_REPO}/releases/tag/${UPSTREAM})."
            echo ""
            echo "$NOTES"
          } > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "v${{ needs.prepare.outputs.version }}"
          body_path: /tmp/release_notes.md
          generate_release_notes: false
