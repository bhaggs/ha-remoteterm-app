name: Check upstream and update version

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Upstream RemoteTerm repository (continuation of the paused
  # jkingsman/Remote-Terminal-for-MeshCore project).
  UPSTREAM_REPO: statico/remoteterm-meshcore

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release tag
        id: upstream
        run: |
          LATEST=$(curl -fsSL \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            | jq -r '.tag_name // empty')
          # Strip leading 'v' if present
          LATEST="${LATEST#v}"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: ${LATEST}"

      - name: Get current app version
        id: current
        run: |
          CURRENT=$(grep '^version:' remoteterm/config.yaml | awk '{print $2}' | tr -d '"')
          # An app-only revision (X.Y.Z.N) still packages upstream X.Y.Z, so
          # compare upstream against the first three parts only.
          UPSTREAM_CURRENT=$(echo "$CURRENT" | cut -d. -f1-3)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM_CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current app version: ${CURRENT} (upstream ${UPSTREAM_CURRENT})"

      - name: Update config.yaml and CHANGELOG if version changed
        if: steps.upstream.outputs.version != '' && steps.upstream.outputs.version != steps.current.outputs.upstream
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
          OLD_VERSION: ${{ steps.current.outputs.version }}
        run: |
          # Update config.yaml version
          sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" remoteterm/config.yaml

          # Release [Unreleased] as the new version in the Keep a Changelog file
          python3 .github/scripts/bump_changelog.py \
            CHANGELOG.md \
            "${NEW_VERSION}" \
            "$(TZ=America/Los_Angeles date +%Y-%m-%d)" \
            --upstream "https://github.com/${UPSTREAM_REPO}" \
            --app-repo "https://github.com/${{ github.repository }}" \
            --ha-changelog remoteterm/CHANGELOG.md

      - name: Open pull request for version bump
        if: steps.upstream.outputs.version != '' && steps.upstream.outputs.version != steps.current.outputs.upstream
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "update/remoteterm-${{ steps.upstream.outputs.version }}"
          commit-message: "chore: bump to upstream RemoteTerm ${{ steps.upstream.outputs.version }}"
          title: "Update: RemoteTerm ${{ steps.upstream.outputs.version }}"
          body: |
            Upstream [RemoteTerm for MeshCore](https://github.com/${{ env.UPSTREAM_REPO }}) released **${{ steps.upstream.outputs.version }}**.

            Changes:
            - Updated `remoteterm/config.yaml` version from `${{ steps.current.outputs.version }}` to `${{ steps.upstream.outputs.version }}`
            - Released the `[Unreleased]` section of `CHANGELOG.md` as `${{ steps.upstream.outputs.version }}` and regenerated `remoteterm/CHANGELOG.md`

            Please review the upstream [CHANGELOG](https://github.com/${{ env.UPSTREAM_REPO }}/blob/main/CHANGELOG.md) before merging.
          labels: "upstream-update"
