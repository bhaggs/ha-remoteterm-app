    <script>
      // ha-app: in-frame safe-area fix.
      // RemoteTerm pads the page by the iOS safe-area insets so it clears the
      // status bar when installed as a full-screen PWA. Inside Home Assistant
      // the page runs in a frame below HA's own header, but iOS still reports
      // the phone's insets to the frame, leaving an empty band above the
      // RemoteTerm header. HA already handles the safe areas, so zero them
      // when framed. Inline styles on <html> override the :root rules.
      if (window.self !== window.top) {
        var haStyle = document.documentElement.style;
        ['top', 'right', 'bottom', 'left', 'bottom-capped'].forEach(function (side) {
          haStyle.setProperty('--safe-area-' + side, '0px');
        });
      }
    </script>
